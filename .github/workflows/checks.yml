name: ERP checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Python syntax
        run: python -m py_compile server.py test_erp.py test_http.py
      - name: Business rules and database integrity
        run: python test_erp.py
      - name: Login and HTTP workflow
        run: python test_http.py
      - name: JavaScript syntax
        run: node --check dist/app.js
      - name: GSM, catalog and scoped search
        run: |
          node test_gsm_ui.cjs
          node test_product_ui.cjs
          node test_search_ui.cjs
      - name: Prevent runtime data in repository
        shell: python
        run: |
          import pathlib, subprocess
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          forbidden = [name for name in tracked if name and (
              name.startswith('data/') or
              pathlib.PurePosixPath(name).suffix.lower() in {'.db', '.sqlite', '.sqlite3', '.pem', '.key'} or
              (pathlib.PurePosixPath(name).name.startswith('.env') and pathlib.PurePosixPath(name).name != '.env.example') or
              name.endswith(('-wal', '-shm')))]
          assert not forbidden, 'Runtime files must not be committed: ' + ', '.join(forbidden)
