name: ERP checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install pinned runtime and audit tool
        run: python -m pip install -r requirements.txt pip-audit==2.9.0
      - name: Python syntax
        run: python -m py_compile server.py security.py webapp.py maintenance.py test_erp.py test_http.py test_security.py
      - name: Business rules and database integrity
        run: python test_erp.py
      - name: Login and HTTP workflow
        run: python test_http.py
      - name: Security and encrypted backup tests
        run: python test_security.py
      - name: Audit production dependencies
        run: python -m pip_audit --strict --disable-pip --no-deps -r requirements.txt
      - name: Build production image
        run: docker build --tag satata-erp-check .
      - name: JavaScript syntax
        run: node --check dist/app.js
      - name: GSM, catalog and scoped search
        run: |
          node test_gsm_ui.cjs
          node test_product_ui.cjs
          node test_search_ui.cjs
      - name: Prevent runtime data in repository
        shell: python
        run: |
          import pathlib, subprocess
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          forbidden = [name for name in tracked if name and (
              name.startswith(('data/', 'backups/', '.runtime-deps/', '.audit-deps/')) or
              pathlib.PurePosixPath(name).suffix.lower() in {'.db', '.sqlite', '.sqlite3', '.pem', '.key', '.token', '.fernet'} or
              (pathlib.PurePosixPath(name).name.startswith('.env') and pathlib.PurePosixPath(name).name != '.env.example') or
              name.endswith(('-wal', '-shm')) or 'recovery-codes' in name)]
          assert not forbidden, 'Runtime files must not be committed: ' + ', '.join(forbidden)
